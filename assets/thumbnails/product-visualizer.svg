<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="rs-title rs-desc">
<title id="rs-title">roninstudio interactive product studio</title><desc id="rs-desc">An animated miniature studio interface: a control deck orbits, its assembly separates, and finish and lighting controls cycle.</desc>
<defs><linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a1a1a"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient><radialGradient id="rs-light"><stop stop-color="#8fc9c3" stop-opacity=".17"/><stop offset="1" stop-color="#8fc9c3" stop-opacity="0"/></radialGradient></defs>
<style>
.rs-orbit{transform-box:fill-box;transform-origin:center;animation:rs-orbit 9s ease-in-out infinite}
.rs-top{animation:rs-top 9s ease-in-out infinite}.rs-board{animation:rs-board 9s ease-in-out infinite}
.rs-finish{animation:rs-finish 9s ease-in-out infinite}.rs-knob{animation:rs-knob 9s ease-in-out infinite}.rs-beam{animation:rs-beam 9s ease-in-out infinite}
.rs-cursor{animation:rs-cursor 9s ease-in-out infinite}.rs-explode-switch{animation:rs-switch 9s ease-in-out infinite}
@keyframes rs-orbit{0%,15%{transform:rotate(-10deg) skewX(-8deg)}35%,65%{transform:rotate(8deg) skewX(5deg)}90%,100%{transform:rotate(-10deg) skewX(-8deg)}}
@keyframes rs-top{0%,45%,90%,100%{transform:translateY(0)}58%,72%{transform:translateY(-38px)}}
@keyframes rs-board{0%,45%,90%,100%{transform:translateY(0)}58%,72%{transform:translateY(-18px)}}
@keyframes rs-finish{0%,19%,92%,100%{transform:translateX(0)}28%,43%{transform:translateX(35px)}50%,82%{transform:translateX(70px)}}
@keyframes rs-knob{0%,28%,100%{transform:translateX(0)}42%,72%{transform:translateX(44px)}}
@keyframes rs-beam{0%,28%,100%{opacity:.4}42%,72%{opacity:1}}
@keyframes rs-cursor{0%,10%{transform:translate(300px,250px)}25%{transform:translate(610px,150px)}42%{transform:translate(653px,219px)}56%,72%{transform:translate(681px,274px)}90%,100%{transform:translate(300px,250px)}}
@keyframes rs-switch{0%,45%,90%,100%{transform:translateX(0)}56%,75%{transform:translateX(13px)}}
@media(prefers-reduced-motion:reduce){.rs-orbit,.rs-top,.rs-board,.rs-finish,.rs-knob,.rs-beam,.rs-cursor,.rs-explode-switch{animation:none}}
</style>
