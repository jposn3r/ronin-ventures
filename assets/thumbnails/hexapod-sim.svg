<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hexBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#050a07"/>
    </linearGradient>
    <linearGradient id="hexBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.08"/>
    </linearGradient>
    <!-- One leg pointing +x: coxa/femur segment, knee joint, tibia segment, foot -->
    <symbol id="hexLeg" overflow="visible">
      <line x1="0" y1="0" x2="46" y2="-7" stroke="#4ade80" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
      <line x1="46" y1="-7" x2="90" y2="9" stroke="#4ade80" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4.5" fill="#4ade80"/>
      <circle cx="46" cy="-7" r="3.2" fill="#4ade80" fill-opacity="0.9"/>
      <circle cx="90" cy="9" r="3" fill="#ffffff" fill-opacity="0.85">
        <animate attributeName="fill-opacity" values="0.85;0.3;0.85" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </symbol>
  </defs>

  <rect width="800" height="450" fill="url(#hexBg)"/>

  <!-- Grid backdrop -->
  <g stroke="#4ade80" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="90"  x2="800" y2="90"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="260" y1="0" x2="260" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="540" y1="0" x2="540" y2="450"/>
    <line x1="680" y1="0" x2="680" y2="450"/>
  </g>

  <!-- Corner telemetry brackets -->
  <g stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <polyline points="30,30 30,18 42,18"/>
    <polyline points="770,30 770,18 758,18"/>
    <polyline points="30,400 30,412 42,412"/>
    <polyline points="770,400 770,412 758,412"/>
  </g>

  <!-- Rotating range-scan ring -->
  <g transform="translate(400,210)">
    <circle r="150" fill="none" stroke="#4ade80" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 14">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Six legs, tripod gait: alternating tripods swing in antiphase -->
  <!-- Tripod A: 0deg, 120deg, 240deg -->
  <g transform="translate(458,210)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>
  <g transform="translate(371,260) rotate(120)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>
  <g transform="translate(371,160) rotate(240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>
  <!-- Tripod B: 60deg, 180deg, 300deg (half-cycle offset) -->
  <g transform="translate(429,260) rotate(60)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>
  <g transform="translate(342,210) rotate(180)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>
  <g transform="translate(429,160) rotate(300)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11;11;-11" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
      <use href="#hexLeg"/>
    </g>
  </g>

  <!-- Hexagonal chassis -->
  <polygon points="458,210 429,159.8 371,159.8 342,210 371,260.2 429,260.2"
    fill="url(#hexBody)" stroke="#4ade80" stroke-opacity="0.9" stroke-width="1.6"/>
  <polygon points="436,210 418,178.8 382,178.8 364,210 382,241.2 418,241.2"
    fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Center sensor core -->
  <circle cx="400" cy="210" r="10" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="1.5"/>
  <circle cx="400" cy="210" r="4" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#4ade80" stroke-opacity="0.5" stroke-width="1">
    <line x1="400" y1="192" x2="400" y2="200"/>
    <line x1="400" y1="220" x2="400" y2="228"/>
    <line x1="382" y1="210" x2="390" y2="210"/>
    <line x1="410" y1="210" x2="418" y2="210"/>
  </g>

  <!-- Telemetry readout -->
  <g font-family="monospace" font-size="9" fill="#4ade80" fill-opacity="0.55" letter-spacing="1.5">
    <text x="52" y="24">IK // SOLVER ACTIVE</text>
    <text x="52" y="38" fill-opacity="0.35">GAIT TRIPOD / LEGS 06</text>
  </g>
  <g font-family="monospace" font-size="9" fill="#4ade80" fill-opacity="0.55" letter-spacing="1.5" text-anchor="end">
    <text x="748" y="24">COXA  24.6&#176;</text>
    <text x="748" y="38" fill-opacity="0.35">TIBIA -12.3&#176;</text>
  </g>

  <!-- Label -->
  <text x="400" y="420" fill="#4ade80" font-family="monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="4" opacity="0.55">HEXAPOD SIMULATOR</text>
</svg>
